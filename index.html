<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تراث ستور - Torathe Store</title>
    
    <!-- Favicon SVG الذهبي -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231A0706'/><circle cx='50' cy='50' r='32' fill='none' stroke='%23D4AF37' stroke-width='2'/><text x='50' y='57' font-family='Arial' font-weight='bold' font-size='30' fill='%23D4AF37' text-anchor='middle'>ت</text></svg>">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --alabaster-grey: #D9D9D9;
            --racing-red: #DD0200;
            --black-cherry: #55100D;
            --coffee-bean: #1A0706;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
        }
        body { background-color: var(--alabaster-grey) !important; color: var(--coffee-bean); font-family: 'Segoe UI', Tahoma, sans-serif; }
        .navbar-custom { background-color: var(--coffee-bean) !important; border-bottom: 2px solid var(--gold-primary); }
        .gold-brand-text { font-family: 'Amiri', serif !important; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; font-weight: 700; }
        .hero-section { background: linear-gradient(rgba(26, 7, 6, 0.88), rgba(26, 7, 6, 0.88)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80'); background-size: cover; color: #fff; padding: 80px 0; text-align: center; border-bottom: 3px solid var(--gold-primary); }
        .product-card { background-color: var(--black-cherry) !important; color: #fff !important; border-radius: 20px !important; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.4) !important; }
        .btn-custom-gold { background: var(--gold-gradient) !important; color: #1A0706 !important; font-weight: bold; border: none; }
        footer { background-color: var(--coffee-bean) !important; color: #fff !important; border-top: 1px solid var(--gold-primary); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
                <span class="gold-brand-text">تراث ستور</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="admin.html" class="btn btn-outline-warning btn-sm"><i class="fas fa-lock"></i> لوحة الأدمن</a>
                <a href="#cart-section" class="btn btn-outline-warning position-relative border-0" style="color: var(--gold-light);">
                    <i class="fas fa-shopping-cart" style="color: var(--gold-primary);"></i> السلة
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background: var(--gold-gradient); color: #1A0706;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3" style="font-family: 'Amiri', serif; color: var(--gold-light);">أهلاً بك في تراث ستور</h1>
            <p class="lead text-white-50">اكتشف أرقى الملابس التراثية والعصرية.</p>
        </div>
    </section>

    <section class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-uppercase" style="color: var(--coffee-bean); font-family: 'Amiri', serif;">منتجاتنا المميزة</h2>
        </div>
        <div id="products-grid" class="row g-4"></div>
    </section>

    <section id="cart-section" class="container py-5 rounded-4 shadow-sm my-4 bg-white border border-warning">
        <h2 class="fw-bold mb-4" style="color: var(--coffee-bean); font-family: 'Amiri', serif;">سلة المشتريات</h2>
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>الإجمالي</th><th>حذف</th></tr>
                        </thead>
                        <tbody id="cart-items-body"></tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="p-4 rounded-4 border text-white" style="background-color: var(--coffee-bean);">
                    <h4 class="fw-bold mb-3" style="color: var(--gold-light);">ملخص الحساب</h4>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between mb-3">
                        <span class="fw-bold">الإجمالي:</span>
                        <span id="grand-total" class="fw-bold fs-5" style="color: var(--gold-primary);">0 جنيه</span>
                    </div>
                    <button class="btn btn-custom-gold w-100 fw-bold py-2" onclick="checkoutWhatsApp()">
                        <i class="fab fa-whatsapp fs-5"></i> إتمام الطلب عبر واتساب
                    </button>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-4 text-center text-white-50">
        Copyright &copy; Torathe Store 2026
    </footer>

    <!-- Supabase CDN & Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
</body>
</html>
