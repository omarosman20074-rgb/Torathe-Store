<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الآمنة - تراث ستور</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .login-box { max-width: 400px; margin: 100px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- شاشة إدخال البريد الإلكتروني للمشرفين / الأدمن -->
    <div id="auth-container" class="container">
        <div class="login-box">
            <h3 class="text-center mb-4 text-danger"><i class="fas fa-lock"></i> دخول لوحة التحكم</h3>
            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني المصرح له:</label>
                <input type="email" id="admin-email" class="form-control" placeholder="اكتب بريدك الإلكتروني هنا...">
            </div>
            <button onclick="loginAdmin()" class="btn btn-dark w-100 mb-3">فتح لوحة التحكم</button>
            <div class="text-center">
                <a href="index.html" class="text-decoration-none text-muted">العودة للمتجر الرئيسي</a>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم وإدارة المنتجات -->
    <div id="dashboard-container" class="container py-5" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>لوحة التحكم - تراث ستور</h2>
            <div>
                <span id="user-email-lbl" class="me-3 text-muted fw-bold"></span>
                <button onclick="logoutAdmin()" class="btn btn-outline-danger btn-sm">تسجيل الخروج</button>
            </div>
        </div>

        <!-- إضافة منتج جديد -->
        <div class="card p-4 mb-4 shadow-sm">
            <h4>إضافة منتج جديد</h4>
            <div class="row g-3 mt-2">
                <div class="col-md-3">
                    <input type="text" id="new-p-name" class="form-control" placeholder="اسم المنتج">
                </div>
                <div class="col-md-2">
                    <input type="number" id="new-p-price" class="form-control" placeholder="السعر">
                </div>
                <div class="col-md-2">
                    <input type="number" id="new-p-stock" class="form-control" placeholder="الكمية">
                </div>
                <div class="col-md-3">
                    <input type="text" id="new-p-img" class="form-control" placeholder="رابط الصورة (URL)">
                </div>
                <div class="col-md-2">
                    <button onclick="addNewProduct()" class="btn btn-success w-100">إضافة</button>
                </div>
            </div>
        </div>

        <!-- جدول عرض المنتجات الحالية -->
        <div class="card p-4 shadow-sm">
            <h4>قائمة المنتجات</h4>
            <table class="table align-middle mt-3">
                <thead>
                    <tr>
                        <th>المنتج</th>
                        <th>السعر</th>
                        <th>الكمية</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="admin-products-table">
                    <!-- البيانات تعبأ برمجياً -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- روابط مكتبات JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
