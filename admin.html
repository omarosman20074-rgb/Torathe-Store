<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الآمنة - تراث ستور</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .login-box { max-width: 400px; margin: 100px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- نموذج تسجيل الدخول (يظهر إذا لم يتم تسجيل الدخول) -->
    <div id="auth-container" class="login-box">
        <h3 class="fw-bold text-center mb-4 text-danger"><i class="fas fa-lock"></i> دخول الأدمن</h3>
        <div class="mb-3">
            <label class="form-label">البريد الإلكتروني:</label>
            <input type="email" id="admin-email" class="form-control" placeholder="admin@gmail.com">
        </div>
        <div class="mb-3">
            <label class="form-label">كلمة المرور:</label>
            <input type="password" id="admin-password" class="form-control" placeholder="••••••••">
        </div>
        <button class="btn btn-dark w-100 fw-bold" onclick="loginAdmin()">تسجيل الدخول</button>
        <div class="text-center mt-3">
            <a href="index.html" class="text-muted text-decoration-none small">العودة للمتجر الرئيسي</a>
        </div>
    </div>

    <!-- لوحة التحكم الفعلية (مخفية ولا تظهر إلا للمسجلين فقط) -->
    <div id="dashboard-container" class="container my-5" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            <h4 class="fw-bold text-success m-0"><i class="fas fa-tools"></i> لوحة التحكم والإدارة</h4>
            <div>
                <span id="user-email-lbl" class="badge bg-secondary me-2"></span>
                <button class="btn btn-outline-danger btn-sm" onclick="logoutAdmin()">تسجيل الخروج</button>
            </div>
        </div>

        <div class="row g-3 mb-4 p-4 bg-white rounded shadow-sm">
            <h5 class="fw-bold text-dark mb-3">إضافة منتج جديد:</h5>
            <div class="col-md-3">
                <input type="text" id="new-p-name" class="form-control" placeholder="اسم المنتج">
            </div>
            <div class="col-md-2">
                <input type="number" id="new-p-price" class="form-control" placeholder="السعر">
            </div>
            <div class="col-md-2">
                <input type="number" id="new-p-stock" class="form-control" value="5" placeholder="المخزون">
            </div>
            <div class="col-md-3">
                <input type="text" id="new-p-img" class="form-control" placeholder="رابط الصورة المباشر">
            </div>
            <div class="col-md-2">
                <button class="btn btn-success w-100 fw-bold" onclick="addNewProduct()">إضافة ونشر</button>
            </div>
        </div>

        <div class="bg-white p-4 rounded shadow-sm">
            <h5 class="fw-bold text-dark mb-3">إدارة المنتجات الحالية:</h5>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-dark">
                        <tr><th>المنتج</th><th>السعر</th><th>المخزون</th><th>إجراء</th></tr>
                    </thead>
                    <tbody id="admin-products-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
